# cmake-asf-trunk-windows.yml -- Configuration for the GitHub Action workflow.
#

name: CMake with the latest ASF libraries

on:
  push:
    branches: ["*"]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    strategy:
      matrix:
        include:
          - build_shared: ON
            cmake_generator: Ninja
            vcpkg_triplet: x64-windows
            arch: x64
      fail-fast: false

    runs-on: windows-latest

    env:
      CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
      CMAKE_INSTALL_PREFIX: ${{ github.workspace }}/installdir

    steps:
      - name: Prepare Environment (Windows)
        if: runner.os == 'Windows'
        run: |
          $root = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          Import-Module "$root\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $root -DevCmdArguments "-arch=${{ matrix.arch }}"

          ls env: | foreach { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }

      - name: Install dependencies (Windows, vcpkg)
        if: runner.os == 'Windows'
        run: |
          C:\vcpkg\vcpkg.exe install --triplet ${{ matrix.vcpkg_triplet }} `
            expat zlib sqlite3 openssl

          "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: apache/apr
          path: apr-2

      - name: Build APR
        working-directory: apr-2
        run: |
          cmake -B out `
            -DBUILD_SHARED_LIBS=${{ matrix.build_shared }}
          cmake --build out --config Release
          cmake --install out --config Release

      - uses: actions/checkout@v4
        with:
          repository: apache/serf
          path: serf-2

      - name: Build Serf
        working-directory: serf-2
        run: |
          cmake -B out `
            -DBUILD_SHARED_LIBS=${{ matrix.build_shared }}
          cmake --build out --config Release
          cmake --install out --config Release

      - uses: actions/checkout@v4
        with:
          path: svn

      - name: gen-make
        run: python ./gen-make.py -t cmake

      - name: Configure Subversion
        run: >
          cmake -B out
          -DBUILD_SHARED_LIBS=${{ matrix.build_shared }}
          -DSVN_ENABLE_TESTS=ON
          -DSVN_ENABLE_RA_SERF=ON
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}

      - name: Build CMake
        run: cmake --build out --config Release

      - name: Install
        run: cmake --install out --config Release
